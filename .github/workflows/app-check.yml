name: App check

# The check of a plugin that uses the devkit, for the app's own workflow to call:
#
#   jobs:
  check:
    runs-on: ubuntu-latest
    # Arch, like the Omarchy machines the baseline of qmllint warnings is made on: Ubuntu's older Qt words and numbers its warnings differently,
    # so every one of them would look new. quickshell is installed so its modules resolve as they do there.
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm git shellcheck jq perl python qt6-declarative quickshell ${{ inputs.node && 'nodejs npm' || '' }}
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: git config --global --add safe.directory '*'
      - run: scripts/devkit/bin/check
