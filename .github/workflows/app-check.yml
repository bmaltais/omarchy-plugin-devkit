name: App check

# The check of a plugin that uses the devkit, for the app's own workflow to call:
#
#   jobs:
#     check:
#       uses: bmaltais/omarchy-plugin-devkit/.github/workflows/app-check.yml@v0.2.8
#       with: { node: true }
#
# It checks out the app with its submodules and runs scripts/devkit/bin/check: shell scripts, the devkit's rules, and the app's own steps
# (devkit_check in devkit.conf). It runs in an Arch container with qmllint and quickshell installed, so the QML step runs and a --no-verify commit cannot pass unnoticed.
# The manifest step still skips itself where omarchy is not installed.
on:
  workflow_call:
    inputs:
      node:
        description: "Install Node 22 (the app's tests use node)"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Arch, like the Omarchy machines the baseline of qmllint warnings is made on: Ubuntu's older Qt words and numbers its warnings
    # differently, so every one of them would look new. quickshell is installed so its modules resolve as they do there.
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm git shellcheck jq perl python qt6-declarative quickshell ${{ inputs.node && 'nodejs npm' || '' }}
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: git config --global --add safe.directory '*'
      - run: scripts/devkit/bin/check
