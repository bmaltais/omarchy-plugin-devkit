# shellcheck shell=bash
# A standalone app, not a plugin (docs/configuration.md#standalone-app): the session runs this command in the nested Hyprland instead of the
# Omarchy shell. Here a terminal stands in for the app; a Qt Quick app would be DEVKIT_APP_CMD=(build/myapp) with DEVKIT_APP_CLASS=myapp.
DEVKIT_NAME=standalone-demo
TOUR_TITLE="Standalone demo"
DEVKIT_APP_CMD=(foot -a standalone-demo sh -c 'echo hello from the session; echo "WARN: a logged warning" >&2; exec sleep 600')
DEVKIT_APP_CLASS='^standalone-demo$'
# foot's one standing warning, not the app's.
DEVKIT_NOISE='xdg-toplevel-icon'
# The app's own variables (the sandbox's XDG dirs and QT_QPA_PLATFORM=wayland are set already).
TOUR_APP_ENV=(DEMO_MODE=1)
# To point the app at your REAL config on purpose, say so here: TOUR_APP_ENV+=(XDG_CONFIG_HOME="$HOME/.config")
